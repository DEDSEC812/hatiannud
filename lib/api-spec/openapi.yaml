openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Haïtien Nud Média API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: videos
  - name: comments
  - name: subscriptions
  - name: users
  - name: support
  - name: ads
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List published videos
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Video" }

  /videos/trending:
    get:
      operationId: trendingVideos
      tags: [videos]
      summary: Trending videos
      responses:
        "200":
          description: Trending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Video" }

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
        "404": { description: Not found }

  /videos/{id}/view:
    post:
      operationId: registerView
      tags: [videos]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: No content }

  /videos/{id}/download:
    post:
      operationId: requestDownload
      tags: [videos]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                type: object
                required: [url, remaining]
                properties:
                  url: { type: string }
                  remaining: { type: integer }
        "402":
          description: Quota exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /videos/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
    post:
      operationId: createComment
      tags: [comments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                anonymous: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /me:
    get:
      operationId: getMe
      tags: [users]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /me/age-confirm:
    post:
      operationId: confirmAge
      tags: [users]
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /plans:
    get:
      operationId: listPlans
      tags: [subscriptions]
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }

  /subscriptions/checkout:
    post:
      operationId: createCheckout
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }

  /support/tickets:
    get:
      operationId: listMyTickets
      tags: [support]
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportTicket" }
    post:
      operationId: createTicket
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string, minLength: 2, maxLength: 200 }
                message: { type: string, minLength: 2, maxLength: 5000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }

  /ads/config:
    get:
      operationId: getAdsConfig
      tags: [ads]
      summary: Returns ad slots based on user's plan
      parameters:
        - in: query
          name: videoId
          schema: { type: string }
      responses:
        "200":
          description: Ads config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdsConfig" }

  /admin/stats:
    get:
      operationId: adminStats
      tags: [admin]
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }

  /admin/videos:
    get:
      operationId: adminListVideos
      tags: [admin]
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Video" }
    post:
      operationId: adminCreateVideo
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }

  /admin/videos/{id}:
    patch:
      operationId: adminUpdateVideo
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Video" }
    delete:
      operationId: adminDeleteVideo
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }

  /admin/users/{id}/block:
    post:
      operationId: adminBlockUser
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }

  /admin/tickets:
    get:
      operationId: adminListTickets
      tags: [admin]
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportTicket" }

  /admin/tickets/{id}/reply:
    post:
      operationId: adminReplyTicket
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ApiError:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
      required: [error]

    Video:
      type: object
      required: [id, title, description, thumbnailUrl, videoUrl, category, durationSec, views, createdAt, isVip]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        thumbnailUrl: { type: string }
        videoUrl: { type: string }
        category: { type: string }
        durationSec: { type: integer }
        views: { type: integer }
        createdAt: { type: string, format: date-time }
        isVip: { type: boolean }
        published: { type: boolean }

    VideoInput:
      type: object
      required: [title, description, thumbnailUrl, videoUrl, category, durationSec]
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, minLength: 2, maxLength: 5000 }
        thumbnailUrl: { type: string }
        videoUrl: { type: string }
        category: { type: string }
        durationSec: { type: integer, minimum: 0 }
        isVip: { type: boolean }
        published: { type: boolean }

    Comment:
      type: object
      required: [id, videoId, body, anonymous, displayName, createdAt]
      properties:
        id: { type: string }
        videoId: { type: string }
        userId: { type: string, nullable: true }
        body: { type: string }
        anonymous: { type: boolean }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }

    Me:
      type: object
      required: [id, email, plan, downloadsRemaining, ageConfirmed, isAdmin]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string, nullable: true }
        plan: { type: string, enum: [free, vip] }
        downloadsRemaining: { type: integer }
        ageConfirmed: { type: boolean }
        isAdmin: { type: boolean }
        subscriptionEndsAt: { type: string, format: date-time, nullable: true }

    Plan:
      type: object
      required: [id, name, durationDays, priceCents, currency, features]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        durationDays: { type: integer }
        priceCents: { type: integer }
        currency: { type: string }
        features:
          type: array
          items: { type: string }

    Subscription:
      type: object
      required: [plan, status]
      properties:
        plan: { type: string, enum: [free, vip] }
        status: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        planName: { type: string, nullable: true }

    SupportTicket:
      type: object
      required: [id, subject, message, status, createdAt]
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        subject: { type: string }
        message: { type: string }
        reply: { type: string, nullable: true }
        status: { type: string, enum: [open, answered, closed] }
        createdAt: { type: string, format: date-time }

    AdsConfig:
      type: object
      required: [preroll, postroll, provider]
      properties:
        provider: { type: string }
        adToken: { type: string, nullable: true }
        preroll: { type: boolean }
        postroll: { type: boolean }

    AdminStats:
      type: object
      required: [totalUsers, activeVip, totalVideos, totalViews, totalDownloads, openTickets]
      properties:
        totalUsers: { type: integer }
        activeVip: { type: integer }
        totalVideos: { type: integer }
        totalViews: { type: integer }
        totalDownloads: { type: integer }
        openTickets: { type: integer }

    AdminUser:
      type: object
      required: [id, email, plan, blocked, createdAt, isAdmin]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string, nullable: true }
        plan: { type: string, enum: [free, vip] }
        blocked: { type: boolean }
        isAdmin: { type: boolean }
        ageConfirmed: { type: boolean }
        createdAt: { type: string, format: date-time }
        subscriptionEndsAt: { type: string, format: date-time, nullable: true }
